name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: mjun0812/github-metrics@v5
        with:
          user: ${{ github.actor }}
          token: ${{ secrets.METRICS_TOKEN }}
          filename: profile-metrics.svg
          template: classic
          combined: "yes"
          chrome_header: yes
          chrome_activity: yes
          chrome_community: yes
          chrome_repositories: yes
          chrome_metadata: yes
